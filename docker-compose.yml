services:
  db:
    image: postgres:17
    environment:
      # Local development credentials only.
      POSTGRES_USER: fewchat
      POSTGRES_PASSWORD: fewchat
      POSTGRES_DB: fewchat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fewchat -d fewchat"]
      interval: 5s
      timeout: 5s
      retries: 10

